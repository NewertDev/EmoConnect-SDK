name: emoconnect_sdk
description: "EmoConnect SDK: connect to EmoConnect devices and receive PPG, motion and battery data, and with a licence the processed PPG waveform and the heart rate."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  meta: ^1.16.0
  path_provider: ^2.1.5
  universal_ble: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  # Each platform bundles the prebuilt core library:
  #   android/src/main/jniLibs/<abi>/libemoconnect_core.so
  #   linux/lib/libemoconnect_core.so
  #   windows/lib/emoconnect_core.dll
  #   ios/Frameworks/EmoConnectCore.xcframework
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true